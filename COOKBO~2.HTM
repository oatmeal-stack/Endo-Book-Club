<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proposed — Endo Center Cookbook Club</title>
<style>
  :root {
    --paper: #faf6ef;
    --accent: #2f7a6f;
    --accent-dark: #235a52;
    --text: #2b2621;
    --muted: #7a6f63;
    --border: #e3d9c8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--text);
    font-family: Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    touch-action: manipulation;
  }
  .wrap {
    width: 100%;
    max-width: 480px;
    padding: 20px 16px 50px;
  }
  nav {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    row-gap: 6px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 10px;
    margin-bottom: 12px;
    font-size: 15px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  nav a {
    color: var(--muted);
    text-decoration: none;
    padding: 8px 4px;
  }
  nav a.active {
    color: var(--accent-dark);
    font-weight: bold;
  }
  .cross-link {
    text-align: center;
    margin-bottom: 26px;
  }
  .cross-link a {
    font-size: 14px;
    color: var(--muted);
    text-decoration: none;
    border-bottom: 1px dotted var(--muted);
  }
  .club-name {
    font-family: Georgia, serif;
    font-size: 18px;
    color: var(--muted);
    text-align: center;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  h1.label {
    font-family: Helvetica, Arial, sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-size: 17px;
    color: var(--muted);
    text-align: center;
    margin: 0 0 28px;
  }
  .entry {
    display: flex;
    gap: 16px;
    padding: 24px 0;
    border-bottom: 1px solid var(--border);
    align-items: center;
  }
  .entry img {
    width: 110px;
    height: auto;
    box-shadow: 0 3px 10px rgba(0,0,0,0.15);
    border: 1px solid var(--border);
    flex-shrink: 0;
  }
  .entry-title {
    font-family: Georgia, serif;
    font-size: 26px;
    margin: 0 0 4px;
    line-height: 1.2;
  }
  .entry-author {
    font-size: 18px;
    color: var(--muted);
    margin: 0 0 10px;
  }
  .entry a.view {
    display: inline-block;
    font-size: 17px;
    color: var(--accent-dark);
    text-decoration: none;
    font-weight: bold;
    padding: 4px 0;
  }
  .empty {
    text-align: center;
    font-size: 18px;
    color: var(--muted);
    padding: 30px 0 40px;
    line-height: 1.6;
  }
  .cta {
    display: block;
    text-align: center;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-family: Helvetica, Arial, sans-serif;
    font-weight: bold;
    font-size: 20px;
    padding: 18px 20px;
    border-radius: 8px;
    letter-spacing: 0.02em;
    margin-top: 24px;
  }
  .cta:active {
    background: var(--accent-dark);
  }
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <a href="cookbook.html">Next Cookbook</a>
    <a href="cookbook-proposed.html" class="active">Proposed</a>
    <a href="cookbook-previous.html">Previously Cooked</a>
  </nav>

  <div class="cross-link"><a href="index.html">&larr; Back to Book Club</a></div>

  <div class="club-name">Endo Center Cookbook Club</div>
  <h1 class="label">Proposed Cookbooks</h1>

  <div class="empty">No suggestions on deck yet — be the first to pitch one below.</div>

  <a class="cta" href="mailto:joeshealy%2Bendobookclub@gmail.com?subject=Cookbook%20suggestion%20for%20the%20club">Suggest a Cookbook</a>
</div>
</body>
</html>
