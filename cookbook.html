  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);

  .wrap {

    margin-bottom: 12px;
    font-size: 15px;
    letter-spacing: 0.02em;
    text-transform: uppercase;

  nav a {
    color: var(--muted);
    text-decoration: none;
    padding: 8px 4px;
  }
  nav a.active {
    color: var(--accent-dark);
    font-weight: bold;
  }
  .cross-link {
    text-align: center;
    margin-bottom: 26px;
  }
  .cross-link a {
    font-size: 14px;
    color: var(--muted);
    text-decoration: none;
    border-bottom: 1px dotted var(--muted);
  }
  .club-name {
    font-family: Georgia, serif;
    font-size: 18px;

    text-align: center;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 8px;

    font-family: Helvetica, Arial, sans-serif;

    color: var(--muted);
    text-align: center;
    margin: 0 0 22px;
  }
  .cover {
    display: block;
    width: 70%;
    max-width: 280px;
    min-width: 180px;
    margin: 0 auto 28px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.15);
    border: 1px solid var(--border);
  }
  .title {
    font-family: Georgia, serif;
    font-size: clamp(30px, 9vw, 40px);
    text-align: center;
    margin: 0 0 12px;
    line-height: 1.15;
    padding: 0 8px;
  }
  .author {
    font-family: Helvetica, Arial, sans-serif;
    font-size: 21px;
    color: var(--muted);
    text-align: center;
    margin: 0 0 30px;
  }
  .meta {
    text-align: center;
    font-size: 18px;
    color: var(--muted);
    margin-bottom: 32px;
    line-height: 1.6;
  }
  .meta strong {
    color: var(--text);
  }
  .cta {
    display: block;
    text-align: center;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-family: Helvetica, Arial, sans-serif;
    font-weight: bold;
    font-size: 20px;
    padding: 18px 20px;
    border-radius: 8px;
    letter-spacing: 0.02em;
  }
  .cta:active {
    background: var(--accent-dark);
