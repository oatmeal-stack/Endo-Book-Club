<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proposed — Endo Center Book Club</title>
<style>
  :root {
    --paper: #faf6ef;
    --accent: #2f7a6f;
    --accent-dark: #235a52;
    --text: #2b2621;
    --muted: #7a6f63;
    --border: #e3d9c8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--text);
    font-family: Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
  }
  .wrap {
    width: 100%;
    max-width: 480px;
    padding: 24px 20px 60px;
  }
  nav {
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    padding-bottom: 14px;
    margin-bottom: 32px;
    font-size: 13px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }
  nav a {
    color: var(--muted);
    text-decoration: none;
  }
  nav a.active {
    color: var(--accent-dark);
    font-weight: bold;
  }
  .club-name {
    font-family: Georgia, serif;
    font-size: 14px;
    color: var(--muted);
    text-align: center;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  h1.label {
    font-family: Helvetica, Arial, sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-size: 13px;
    color: var(--muted);
    text-align: center;
    margin: 0 0 28px;
  }
  .entry {
    display: flex;
    gap: 14px;
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
    align-items: center;
  }
  .entry img {
    width: 56px;
    height: auto;
    box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    border: 1px solid var(--border);
    flex-shrink: 0;
  }
  .entry-title {
    font-family: Georgia, serif;
    font-size: 17px;
    margin: 0 0 2px;
    line-height: 1.25;
  }
  .entry-author {
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 6px;
  }
  .entry a.view {
    font-size: 13px;
    color: var(--accent-dark);
    text-decoration: none;
    font-weight: bold;
  }
  .empty {
    text-align: center;
    font-size: 14px;
    color: var(--muted);
    padding: 30px 0 40px;
    line-height: 1.6;
  }
  .cta {
    display: block;
    text-align: center;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-family: Helvetica, Arial, sans-serif;
    font-weight: bold;
    font-size: 16px;
    padding: 14px 20px;
    border-radius: 6px;
    letter-spacing: 0.02em;
    margin-top: 28px;
  }
  .cta:hover {
    background: var(--accent-dark);
  }
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <a href="index.html">Next Book</a>
    <a href="proposed.html" class="active">Proposed</a>
    <a href="previous.html">Previously Read</a>
  </nav>

  <div class="club-name">Endo Center Book Club</div>
  <h1 class="label">Proposed Books</h1>

  <div class="empty">No suggestions on deck yet — be the first to pitch one below.</div>

  <a class="cta" href="mailto:joeshealy%2Bendobookclub@gmail.com?subject=Book%20suggestion%20for%20the%20club">Suggest a Book</a>
</div>
</body>
</html>
