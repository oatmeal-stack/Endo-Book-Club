<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Previously Cooked — Endo Center Cookbook Club</title>
<style>
  :root {
    --paper: #faf6ef;
    --accent: #2f7a6f;
    --accent-dark: #235a52;
    --text: #2b2621;
    --muted: #7a6f63;
    --border: #e3d9c8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--text);
    font-family: Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    touch-action: manipulation;
  }
  .wrap {
    width: 100%;
    max-width: 480px;
    padding: 20px 16px 50px;
  }
  nav {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    row-gap: 6px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 10px;
    margin-bottom: 12px;
    font-size: 15px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  nav a {
    color: var(--muted);
    text-decoration: none;
    padding: 8px 4px;
  }
  nav a.active {
    color: var(--accent-dark);
    font-weight: bold;
  }
  .cross-link {
    text-align: center;
    margin-bottom: 26px;
  }
  .cross-link a {
    font-size: 14px;
    color: var(--muted);
    text-decoration: none;
    border-bottom: 1px dotted var(--muted);
  }
  .club-name {
    font-family: Georgia, serif;
    font-size: 18px;
    color: var(--muted);
    text-align: center;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  h1.label {
    font-family: Helvetica, Arial, sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-size: 17px;
    color: var(--muted);
    text-align: center;
    margin: 0 0 28px;
  }
  .entry {
    display: flex;
    gap: 16px;
    padding: 24px 0;
    border-bottom: 1px solid var(--border);
    align-items: center;
  }
  .entry img {
    width: 110px;
    height: auto;
    box-shadow: 0 3px 10px rgba(0,0,0,0.15);
    border: 1px solid var(--border);
    flex-shrink: 0;
  }
  .entry-title {
    font-family: Georgia, serif;
    font-size: 26px;
    margin: 0 0 4px;
    line-height: 1.2;
  }
  .entry-author {
    font-size: 18px;
    color: var(--muted);
    margin: 0 0 4px;
  }
  .entry-date {
    font-size: 15px;
    color: var(--muted);
    font-style: italic;
    margin: 0 0 8px;
  }
  .entry a.view {
    display: inline-block;
    font-size: 17px;
    color: var(--accent-dark);
    text-decoration: none;
    font-weight: bold;
    padding: 4px 0;
  }
</style>
</head>
<body>
<div class="wrap">

    <a href="cookbook-proposed.html">Proposed</a>
    <a href="cookbook-previous.html" class="active">Previously Cooked</a>
  </nav>

  <div class="cross-link"><a href="index.html">&larr; Back to Book Club</a></div>

  <div class="club-name">Endo Center Cookbook Club</div>

  <div class="entry">

    <div>
      <div class="entry-title">Modern Comfort Food</div>
      <div class="entry-author">Ina Garten</div>
      <div class="entry-date">Date read: —</div>
      <a class="view" href="https://www.amazon.com/dp/0804187061" target="_blank" rel="noopener">View on Amazon</a>
    </div>
  </div>

  <div class="entry">
    <img src="https://covers.openlibrary.org/b/id/12941575-M.jpg" alt="From Crook to Cook cover">
    <div>
      <div class="entry-title">From Crook to Cook</div>
      <div class="entry-author">Snoop Dogg</div>
      <div class="entry-date">Date read: —</div>
      <a class="view" href="https://www.amazon.com/dp/1452179611" target="_blank" rel="noopener">View on Amazon</a>
    </div>
  </div>

</div>
</body>
</html>
